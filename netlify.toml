[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
  # Node 18 went end of life in April 2025 and Netlify no longer provisions it
  # reliably. Vite 6 and React 19 both want 20 or newer anyway. A pinned EOL
  # runtime is a build that fails on a day nobody changed anything.
  NODE_VERSION = "20.19.0"

# Declared rather than left to auto detection. Both handlers are ESM, which is
# what package.json "type": "module" makes them, and esbuild is the bundler that
# handles that without a wrapper. An undeclared functions directory is one
# rename away from a checkout that silently 404s.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The direct Solana rail's safety net. Walks pending payment requests and asks
# the chain, so a transfer sent from a phone after the laptop closed still
# settles and still notifies. See netlify/functions/solana-pay-sweep.js.
[functions."solana-pay-sweep"]
  schedule = "*/5 * * * *"

# Apple Pay domain verification. Stripe fetches this file to verify
# shop.neonburro.com for Apple Pay in the Express Checkout Element. Without it
# the SPA catch all served index.html here and verification failed quietly.
# The file is Stripe's own, https://stripe.com/files/apple-pay/apple-developer-merchantid-domain-association
[[headers]]
  for = "/.well-known/apple-developer-merchantid-domain-association"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=31536000"

# Specific redirect for invoice page to use the custom HTML with proper meta tags
[[redirects]]
  from = "/invoice"
  to = "/invoice.html"
  status = 200

# Catch-all redirect for all other routes (SPA behavior)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
